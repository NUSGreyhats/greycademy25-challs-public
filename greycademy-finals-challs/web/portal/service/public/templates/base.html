<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>{% block title %}Portal{% endblock %}</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
            background: #0f172a;
            color: #e2e8f0;
            min-height: 100vh;
            display: flex;
            flex-direction: column;
        }
        .header {
            background: #1e293b;
            border-bottom: 1px solid #334155;
            padding: 20px;
            text-align: center;
        }
        .logo {
            font-size: 1.5em;
            color: #3b82f6;
            font-weight: 600;
        }
        .container {
            flex: 1;
            max-width: 600px;
            margin: 40px auto;
            padding: 20px;
            width: 100%;
        }
        .card {
            background: #1e293b;
            border: 1px solid #334155;
            border-radius: 8px;
            padding: 30px;
        }
        .card h2 {
            color: #f1f5f9;
            margin-bottom: 24px;
            font-size: 1.5em;
            font-weight: 600;
        }
        .form-group {
            margin-bottom: 20px;
        }
        label {
            display: block;
            margin-bottom: 6px;
            color: #94a3b8;
            font-size: 0.9em;
        }
        input[type="text"],
        input[type="password"] {
            width: 100%;
            padding: 12px;
            background: #0f172a;
            border: 1px solid #334155;
            color: #e2e8f0;
            border-radius: 6px;
            font-size: 1em;
        }
        input[type="text"]:focus,
        input[type="password"]:focus {
            outline: none;
            border-color: #3b82f6;
        }
        .btn {
            width: 100%;
            padding: 12px;
            background: #3b82f6;
            color: #fff;
            border: none;
            border-radius: 6px;
            font-size: 1em;
            cursor: pointer;
            font-weight: 500;
        }
        .btn:hover {
            background: #2563eb;
        }
        .btn-secondary {
            background: #475569;
        }
        .btn-secondary:hover {
            background: #64748b;
        }
        .error {
            background: rgba(239, 68, 68, 0.1);
            border: 1px solid #ef4444;
            color: #fca5a5;
            padding: 12px;
            border-radius: 6px;
            margin-bottom: 20px;
        }
        .links {
            text-align: center;
            margin-top: 20px;
        }
        .links a {
            color: #3b82f6;
            text-decoration: none;
            margin: 0 10px;
        }
        .links a:hover {
            text-decoration: underline;
        }
        .footer {
            background: #1e293b;
            border-top: 1px solid #334155;
            padding: 15px;
            text-align: center;
            color: #64748b;
            font-size: 0.8em;
        }
    </style>
</head>
<body>
    <div class="header">
        <div class="logo">Network Portal</div>
    </div>

    <div class="container">
        {% block content %}{% endblock %}
    </div>

    <div class="footer">
        Network Portal v1.0
    </div>
</body>
</html>
