<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Oops.</title>
    <style>
        /* Shared Base Styles */
        body, html {
            height: 100%;
            margin: 0;
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
            background-color: #121212;
            color: #e0e0e0;
            display: flex;
            justify-content: center;
            align-items: center;
        }

        .container {
            text-align: center;
            padding: 2rem;
            max-width: 400px;
        }

        /* Error Specific Styling */
        h1 {
            font-weight: 300;
            font-size: 4rem; /* Larger for the error code */
            letter-spacing: 5px;
            margin: 0;
            color: #ff5555; /* Subtle red tint for error indication */
            opacity: 0.8;
            text-shadow: 0px 0px 10px rgba(255, 85, 85, 0.3);
        }

        h2 {
            font-weight: 400;
            font-size: 1rem;
            text-transform: uppercase;
            letter-spacing: 3px;
            margin-top: 0.5rem;
            margin-bottom: 2rem;
            color: #888;
        }

        p {
            font-size: 0.95rem;
            line-height: 1.6;
            color: #a0a0a0;
            margin-bottom: 2.5rem;
        }

        a {
            text-decoration: none;
            color: #a0a0a0;
            border: 1px solid #444;
            padding: 10px 30px;
            border-radius: 4px;
            font-size: 0.8rem;
            text-transform: uppercase;
            letter-spacing: 1px;
            transition: all 0.3s ease;
        }

        a:hover {
            border-color: #fff;
            color: #fff;
            background-color: rgba(255, 255, 255, 0.05);
        }
    </style>
</head>
<body>

    <div class="container">
        <h1>ERR!</h1>
        <h2>Transfer Interrupted</h2>
        
        <p>
            I've told you already, there's nothing else you'd need to be looking for!
        </p>
        
        <a href="/">Bring me back</a>
    </div>

</body>
</html>
