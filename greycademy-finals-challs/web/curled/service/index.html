<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>My Humble Abode</title>
    <style>
        body, html {
            height: 100%;
            margin: 0;
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
            background-color: #0f0f12;
            color: #e0e0e0;
            display: flex;
            justify-content: center;
            align-items: center;
        }

        .container {
            text-align: center;
            padding: 2rem;
            max-width: 400px;
        }

        h1 {
            font-weight: 200;
            letter-spacing: 5px;
            margin-bottom: 1.5rem;
            color: #fff;
        }

        p {
            font-size: 0.95rem;
            line-height: 1.8;
            color: #888;
            margin-bottom: 3rem;
        }

        /* The Accented Button */
        .glow-button {
            background: transparent;
            border: 2px solid #00d4ff; /* Neon Cyan accent */
            color: #00d4ff;
            padding: 15px 45px;
            cursor: pointer;
            border-radius: 50px;
            font-size: 0.9rem;
            font-weight: 600;
            text-transform: uppercase;
            letter-spacing: 2px;
            transition: all 0.4s ease;
            box-shadow: 0 0 10px rgba(0, 212, 255, 0.2);
        }

        .glow-button:hover {
            background: #00d4ff;
            color: #0f0f12;
            box-shadow: 0 0 30px rgba(0, 212, 255, 0.6);
            transform: translateY(-2px);
        }

        .glow-button:active {
            transform: translateY(1px);
        }
    </style>
</head>
<body>

    <div class="container">
        <h1>Welcome to my Humble Abode!</h1>
        <p>
            I believe I know exactly what you've come here to find, there is no need to look any further. <br/>
            All you need to do is to press the button, and hopefully, you'll be able to obtain what you're looking for.
        </p>
        
        <form action="/flag" method="POST">
            <input type="hidden" name="poast" value="flag">
            
            <button type="submit" class="glow-button">SEND IT!</button>
        </form>
    </div>

</body>
</html>
